server:
  port: 7712

spring:
  application:
    name: JournalApp
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: Journal
    password: password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

logging:
  level:
    org:
      springframework:
        security: DEBUG